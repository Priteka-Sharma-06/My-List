<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <title>Simple To Do list</title>
  <style>
  :root{
    --lt-bg:#f9ead4;
    --tap:#c96b6f;
    --text:#5a3a3c;
  }
body{
    font-family:"Dm sans", serif;
    font-weight:300 400 500 ;
    background:#fdf6ec;
    color:var(--text);
  }
  
 h1{
   font-family:"Playfair Display" , serif;
   
   font-weight:800;
   color:var(--text);
 }
 p{
   color:#e8979a;
 }
  .container{
    background:rgba(255, 255, 255, 0.72);
      padding:36px 32px 32px;
  border-radius:24px;
  box-shadow:
  0 4px 6px rgba(180,100,105,0.12),
  0 20px 60px rgba(180,100,105,0.09),
  inset 0 1px 0 rgba(255,255,255,0.9);
border:1px solid rgba(242,196,198,0.5);
  }
    .list{
      list-style-type:none;
      background:var(--lt-bg);
      border-radius:7px;
      border:1px solid rgba(238, 172, 173);
      padding:5px;
      display:flex;
      align-items: center;
      gap:10px;
      margin-top:10px;
      
    }
    #input{
       font-size:14.5px;
   font-weight:400;
   padding:13px 16px;
   border-radius:12px;
   background:var(--lt-bg);
   border:1.5px solid transparent;
   color:#b89496;
   transition: border-color 1s, transform 1s;
    }
   
    #input:focus{
  border-color: var(--tap);
  transform: scale(1.03);
  outline: none;
}

    #submit{
      padding:13px 16px;
   border-radius:12px;
   background:var(--tap);
   box-shadow: 0 4px 14px rgba(201,107,111,0.35);
   border:none;
   color: white ;
   font-size:15px;
   font-weight:300;
    }
    
#remain{
  background:var(--lt-bg);
  color:#e8979a;
  border-radius:10px;
  padding:3px;
}

.checkbtn{
  appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid var(--tap);
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  background:rgba(255, 255, 255, 0.72);
  transition: all 0.2s ease;
}

.checkbtn:checked{
  background: var(--tap);
}

.checkbtn:checked::after{
  content: "✓";
  color: white;
  font-size: 14px;
  position: absolute;
  left: 4px;
  top: -1px;
}

.cancelbtn{
margin-left:auto;
background:var(--tap);
box-shadow: 0 4px 14px rgba(201,107,111,0.35);
   border:none;
   color: white ;
   font-size:15px;
   font-weight:300;
   border-radius:4px;
}
.done{
  text-decoration: line-through;
  color:grey;
}
    
  </style>
</head>

<body>
  <div class="container">
    <p>Today's</p>
    <h1>My list</h1>
    <span id="remain">0 task</span>
    <br><br>
  <form>
    <input id="input" type="text" placeholder="Add somthing to Do... ">
    <input type="submit" id="submit" value=+>
  </form>
  
  <ul id="list">
    
  </ul>
  </div>
  
  <script>
  let form=document.querySelector("form");
  let count=0;
  let remain=0;
  
  function update(){
  document.querySelector("#remain").textContent=`${remain} of ${count} remaining `;
  }
  
  
  form.addEventListener("submit", function (event){
    event.preventDefault();
    
     let input=document.querySelector("#input").value.trim();
     
    if(input==="") return;
    count++;
    remain++;
    let item=document.createElement("li");
    item.className="list";
    
    let checkbox=document.createElement("input");
    checkbox.type="checkbox";
    checkbox.className="checkbtn";
    
    let text=document.createElement("span");
    text.textContent=input;
    
    let cancelbtn=document.createElement("button");
    cancelbtn.textContent="×";
    cancelbtn.className="cancelbtn";
    
    item.appendChild(checkbox);
    item.appendChild(text);
    item.appendChild(cancelbtn);
    
    
    let tasklist=document.querySelector("#list");
    tasklist.appendChild(item);
    
    
    document.querySelector("#input").value="";
    
    
    
      
    checkbox.addEventListener("change",function(){
      if(checkbox.checked){
      text.classList.add("done");
      remain--;
      update();
      }else{
        text.classList.remove("done");
        remain++;
        update();
      }
    }
      
    );
 
    
    cancelbtn.addEventListener("click", function (){
      if(!checkbox.checked)
      {
        remain--;
      }
      count--;
      item.remove();
      update();
    
  });
  
  update();

}); 
  
  </script>
</body>

</html>
